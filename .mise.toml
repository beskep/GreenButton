[tools]
oxfmt = "latest"
prek  = "latest"
tombi = "latest"
typos = "latest"

[tasks]
[tasks.format]
run = [
  "uvx ruff format",
  "tombi format",
  "oxfmt",
]

[tasks.lint]
run = [
  "uvx ruff check --fix --exit-zero",
  "uvx ty check --fix --exit-zero",
  "typos",
]

[tasks.check]
run = [{ task = "format" }, { task = "lint" }]
